name: plantpal_ai
description: AI Plant Care & Growth Tracker
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  get: ^4.7.2

  # Responsive
  flutter_screenutil: ^5.9.3

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # SVG
  flutter_svg: ^2.2.0

  # Animation
  lottie: ^3.3.2
  shimmer: ^3.0.0

  # Notifications
  flutter_local_notifications: ^22.0.1

  # Permissions
  permission_handler: ^12.0.1

  # Fonts
  google_fonts: ^6.3.1

  # Date
  intl: ^0.20.2

  # AI
  google_generative_ai: ^0.4.7

  # Icons
  iconsax_flutter: ^1.0.1

  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.5
  share_plus: ^10.0.2
  timezone: ^0.11.1
  flutter_timezone: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
    - assets/lottie/

